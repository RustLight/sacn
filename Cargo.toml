[package]
name = "sacn"
description = "A Rust implementation of the ANSI E1.31 Streaming ACN protocol, tested against protocol version ANSI E1.31-2018."
version = "0.12.1"
edition = "2024"
rust-version = "1.88"
readme = "README.md"
keywords = ["acn", "sacn", "dmx", "e131", "ansi"]
authors = ["Lukas Schmierer <lukas.schmierer@lschmierer.de>", "Paul Lancaster <paul@lancasterzone.com>"]
documentation = "https://github.com/RustLight/sacn"
repository = "https://github.com/RustLight/sacn"
license = "MIT OR Apache-2.0"
# Publish only what building, testing and documenting the crate needs, so
# repository tooling (CI, Docker images, lint configs) stays out of the crate and
# changes to it don't trigger a release.
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/build.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[dependencies]
byteorder = { version = "1.5.0", features = [] }
if-addrs = { version = "0.15.0", features = ["link-local"] }
libc = { version = "0.2.171" }
log = { version = "0.4.20", optional = true }
socket2 = { version = "0.6.1", features = ["all"] }
thiserror = "2.0.0"
uuid = { version = "1.12", features = ["v4"] }

[dev-dependencies]
crossterm = "0.29.0"
serial_test = { version = "4.0.1", features = ["file_locks"] }

[features]
default = ["std", "logging"]
std = []
# Reports errors from the library's background threads through the `log` crate. Disable to drop the dependency; the errors are then discarded.
logging = ["dep:log"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ci)'] }

[[example]]
name = 'simple-receiver'
path = 'examples/simple-receiver.rs'

[[example]]
name = 'sine-wave-sender'
path = 'examples/sine-wave-sender.rs'

[[example]]
name = 'demo_rcv'
path = 'examples/demo_rcv/src/main.rs'

[[example]]
name = 'demo_src'
path = 'examples/demo_src/src/main.rs'
