name: Rust

on:
  push:
    branches: [ "main" ]
  # No branch filter, so stacked pull requests (based on another PR's branch) get CI too.
  pull_request:

permissions:
  contents: read
  # dorny/paths-filter lists a pull request's changed files through the API.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which of the jobs below a change needs. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
    steps:
    - uses: dorny/paths-filter@v4.0.3
      if: github.event_name == 'pull_request'
      id: filter
      with:
        # Anything that can change what gets built or tested, including doc
        # comments in .rs files, which rustdoc and doctests read.
        filters: |
          code:
            - 'src/**'
            - 'tests/**'
            - 'examples/**'
            - 'benches/**'
            - 'build.rs'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - '.cargo/**'
            - 'rust-toolchain'
            - 'rust-toolchain.toml'
            - 'clippy.toml'
            - '.clippy.toml'
            - 'rustfmt.toml'
            - '.rustfmt.toml'
            - 'docker-linux/**'
            - '.github/workflows/**'
          docs:
            - '**/*.md'
            - 'documentation/**'
            - 'LICENSE-*'
            - '.rumdl.toml'
            - 'lychee.toml'
            - '.pre-commit-config.yaml'
          workflows:
            - '.github/workflows/**'
            - '.pre-commit-config.yaml'

  test-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Check formatting
      run: cargo fmt --check

    - name: Build
      run: cargo build --locked --verbose

    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Install llvm-tools
      run: rustup component add llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2.90.10
      with:
        tool: cargo-llvm-cov@0.9.1

    # `cargo test` with coverage recorded, for the coverage job. The doctests
    # run in the docs job.
    - name: Run tests
      run: cargo llvm-cov --locked --verbose --lcov --output-path target/lcov.info

    - name: Upload coverage
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-unit
        path: target/lcov.info
        if-no-files-found: error

  # The IPv4 and IPv6 network tests run in the Docker image with coverage
  # recorded by docker-linux/run_coverage.sh. The checkout is mounted at the
  # same path in the container, so the coverage's file paths match it.
  test-linux-ipv4:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Build
      run: docker build --build-arg COVERAGE=1 -t sacn-tests -f docker-linux/Dockerfile .
    - name: Run tests
      run: >-
        docker run --cap-add=NET_ADMIN --cap-add=SYS_ADMIN
        -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE"
        sacn-tests ./docker-linux/run_coverage.sh ipv4
    - name: Upload coverage
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-ipv4
        path: target/llvm-cov/lcov.info
        if-no-files-found: error

  test-linux-ipv6:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Build
      run: docker build --build-arg COVERAGE=1 -t sacn-tests -f docker-linux/Dockerfile .
    - name: Create IPv6 network
      run: docker network create --ipv6 --subnet fd00:5ac0::/64 sacn-ipv6
    - name: Run tests
      run: >-
        docker run --cap-add=NET_ADMIN --cap-add=SYS_ADMIN --network sacn-ipv6
        -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE"
        sacn-tests ./docker-linux/run_coverage.sh ipv6
    - name: Upload coverage
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-ipv6
        path: target/llvm-cov/lcov.info
        if-no-files-found: error

  test-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Build
      run: cargo build --locked --verbose

    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --locked --verbose

  test-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Build
      run: cargo build --locked --verbose

    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --locked --verbose

  # Merges the coverage recorded by test-linux (the unit tests),
  # test-linux-ipv4 and test-linux-ipv6. The job summary shows the coverage of each file
  # and, on pull requests, diff-cover's report on the lines the pull request
  # changes. The HTML report is kept as an artifact; on main, coverage-pages
  # publishes it with the README badge's data. Doctests aren't measured, because
  # cargo-llvm-cov needs nightly Rust for them.
  coverage:
    needs: [changes, test-linux, test-linux-ipv4, test-linux-ipv6]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
        # diff-cover compares the pull request with its base branch.
        fetch-depth: 0

    - name: Download the test jobs' coverage
      uses: actions/download-artifact@v8.0.1
      with:
        pattern: coverage-*
        path: coverage/

    - name: Install grcov
      uses: taiki-e/install-action@v2.90.10
      with:
        tool: grcov@0.10.7

    # grcov adds up the line counts of the three lcov files, and makes the file
    # paths relative to the checkout.
    - name: Merge coverage
      run: |
        inputs=(coverage/coverage-unit/lcov.info coverage/coverage-ipv4/lcov.info coverage/coverage-ipv6/lcov.info)
        grcov "${inputs[@]}" --source-dir . --output-types lcov --output-path coverage/lcov.info
        grcov "${inputs[@]}" --source-dir . --output-types html --output-path coverage/html

    # Lines only: the function counts in the jobs' coverage don't add up, as
    # the library is built separately for unit tests and integration tests, so
    # the functions column of the HTML report overcounts.
    - name: Summarise coverage
      run: |
        {
          echo "## Coverage"
          echo
          echo "| File | Line coverage | Lines hit |"
          echo "| --- | ---: | ---: |"
          awk -F: '
            function pct(hit, found) { return found ? sprintf("%.2f%%", 100 * hit / found) : "-" }
            /^SF:/ { file = substr($0, 4) }
            /^LF:/ { found = $2; total_found += $2 }
            /^LH:/ { hit = $2; total_hit += $2 }
            /^end_of_record/ { printf "| %s | %s | %d of %d |\n", file, pct(hit, found), hit, found }
            END { printf "| **Total** | %s | %d of %d |\n", pct(total_hit, total_found), total_hit, total_found }
          ' coverage/lcov.info
          echo
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Report coverage of changed lines
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        pipx run --spec diff-cover==11.0.1 diff-cover coverage/lcov.info \
          --compare-branch "origin/$BASE_REF" \
          --format "markdown:coverage/diff-cover.md"
        cat coverage/diff-cover.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the coverage report
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-report
        path: |
          coverage/lcov.info
          coverage/html/

    # Data for the README badge, read by shields.io's endpoint badge
    # (https://shields.io/badges/endpoint-badge).
    - name: Write the badge data
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        percent=$(awk -F: '/^LF:/ { found += $2 } /^LH:/ { hit += $2 } END { printf "%.1f", found ? 100 * hit / found : 0 }' coverage/lcov.info)
        jq -n --argjson p "$percent" '{
          schemaVersion: 1,
          label: "coverage",
          message: "\($p)%",
          color: (if $p >= 90 then "brightgreen" elif $p >= 75 then "green" elif $p >= 60 then "yellow" else "red" end)
        }' > coverage/html/coverage.json

    - name: Upload the Pages site
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: coverage/html/

  # Publishes main's coverage report and badge data to GitHub Pages, at
  # https://rustlight.github.io/sacn/. Not part of all-checks, as it only runs
  # after a merge.
  coverage-pages:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v5.0.1

  # Checks that the library builds with the oldest Rust it supports, the
  # rust-version in Cargo.toml. The tests and dev-dependencies can need a newer
  # Rust, so only the library is checked. Cargo.lock is resolved afresh for that
  # Rust version, picking dependency versions it can build, as Cargo does for
  # users of the crate.
  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install the minimum supported Rust version
      id: msrv
      run: |
        msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sacn") | .rust_version')
        echo "Minimum supported Rust version: $msrv"
        rustup toolchain install "$msrv" --profile minimal
        echo "version=$msrv" >> "$GITHUB_OUTPUT"

    - name: Check the library
      env:
        MSRV: ${{ steps.msrv.outputs.version }}
        CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      run: |
        cargo "+$MSRV" generate-lockfile
        cargo "+$MSRV" check --lib
        cargo "+$MSRV" check --lib --no-default-features --features std

  # Runs for code and docs changes alike: Markdown files can be pulled into the
  # crate docs with include_str!, so their examples run as doctests.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Build documentation
      run: cargo doc --locked --no-deps
      env:
        RUSTDOCFLAGS: -D warnings

    - name: Run doctests
      run: cargo test --locked --doc

  # Checks that .github/workflows/actions.lock matches the workflows and that
  # every locked action commit still verifies upstream. After changing a
  # `uses:` line, run `gh actions-lock` to update the lockfile.
  lockfile:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: github/gh-actions-lock@verify/v0.5.1

  # Runs the lint hooks from .pre-commit-config.yaml (at the versions pinned
  # there, so CI matches local runs): rumdl and lychee for Markdown,
  # actionlint and zizmor for the workflows.
  lint:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Run lint hooks
      uses: j178/prek-action@v3.1.1
      with:
        prek-version: '0.5.11'
        extra-args: --all-files rumdl-check lychee actionlint zizmor
      env:
        # Authenticated requests avoid GitHub's rate limits when installing
        # the tools and checking github.com links (GITHUB_TOKEN), and turn on
        # zizmor's online audits (GH_TOKEN).
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The single required status check. Jobs skipped by the path filter count as
  # passing; a failed or cancelled job (including `changes`) fails this one.
  all-checks:
    needs: [changes, test-linux, test-linux-ipv4, test-linux-ipv6, test-windows, test-macos, msrv, coverage, docs, lockfile, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check job results
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for result in $RESULTS; do
          case "$result" in
            success|skipped) ;;
            *) echo "A required job did not succeed."; exit 1 ;;
          esac
        done
