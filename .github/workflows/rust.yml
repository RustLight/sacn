name: Rust

on:
  push:
    branches: [ "main" ]
  # No branch filter, so stacked pull requests (based on another PR's branch) get CI too.
  pull_request:

permissions:
  contents: read
  # dorny/paths-filter lists a pull request's changed files through the API.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which of the jobs below a change needs. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
    steps:
    - uses: dorny/paths-filter@v4.0.3
      if: github.event_name == 'pull_request'
      id: filter
      with:
        # Anything that can change what gets built or tested, including doc
        # comments in .rs files, which rustdoc and doctests read.
        filters: |
          code:
            - 'src/**'
            - 'tests/**'
            - 'examples/**'
            - 'benches/**'
            - 'build.rs'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - '.cargo/**'
            - 'rust-toolchain'
            - 'rust-toolchain.toml'
            - 'clippy.toml'
            - '.clippy.toml'
            - 'rustfmt.toml'
            - '.rustfmt.toml'
            - 'docker-linux/**'
            - '.github/workflows/**'
          docs:
            - '**/*.md'
            - 'documentation/**'
            - 'LICENSE-*'
            - '.rumdl.toml'
            - 'lychee.toml'
            - '.pre-commit-config.yaml'
          workflows:
            - '.github/workflows/**'
            - '.pre-commit-config.yaml'

  test-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false

    - name: Check formatting
      run: cargo fmt --check

    - name: Build
      run: cargo build --locked --verbose

    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --locked --verbose

  test-linux-ipv4:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false
    - name: Build
      run: docker build -t sacn-tests -f docker-linux/Dockerfile .
    - name: Run tests
      run: docker run --cap-add=NET_ADMIN --cap-add=SYS_ADMIN sacn-tests

  test-linux-ipv6:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false
    - name: Build
      run: docker build -t sacn-tests -f docker-linux/Dockerfile .
    - name: Create IPv6 network
      run: docker network create --ipv6 --subnet fd00:5ac0::/64 sacn-ipv6
    - name: Run tests
      run: docker run --cap-add=NET_ADMIN --cap-add=SYS_ADMIN --network sacn-ipv6 sacn-tests ./run_tests_ipv6.sh

  test-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false

    - name: Build
      run: cargo build --locked --verbose

    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --locked --verbose

  test-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false

    - name: Build
      run: cargo build --locked --verbose

    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --locked --verbose

  # Measures the line coverage of `cargo test` with cargo-llvm-cov. The job
  # summary shows the totals for each file and, on pull requests, diff-cover's
  # report on the lines the pull request changes. The HTML report is kept as an
  # artifact; on main, coverage-pages publishes it with the README badge's data.
  # Doctests aren't measured, because cargo-llvm-cov needs nightly Rust for them.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false
        # diff-cover compares the pull request with its base branch.
        fetch-depth: 0

    - name: Install cargo-llvm-cov
      run: |
        rustup component add llvm-tools-preview
        cargo install cargo-llvm-cov --locked --version 0.9.1

    - name: Run tests with coverage
      run: |
        cargo llvm-cov --locked --no-report
        cargo llvm-cov report --html
        cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
        cargo llvm-cov report --json --summary-only --output-path target/llvm-cov/summary.json

    - name: Summarise coverage
      run: |
        {
          echo "## Coverage"
          echo
          echo "| File | Lines | Functions | Regions |"
          echo "| --- | ---: | ---: | ---: |"
          jq -r --arg root "$GITHUB_WORKSPACE/" '
            def pct: "\(. * 100 | round / 100)%";
            def row($name): "| \($name) | \(.lines.percent | pct) | \(.functions.percent | pct) | \(.regions.percent | pct) |";
            .data[0]
            | (.files[] | .summary as $s | .filename | ltrimstr($root) as $f | $s | row($f)),
              (.totals | row("**Total**"))
          ' target/llvm-cov/summary.json
          echo
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Report coverage of changed lines
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        pipx run --spec diff-cover==11.0.1 diff-cover target/llvm-cov/lcov.info \
          --compare-branch "origin/$BASE_REF" \
          --format "markdown:target/llvm-cov/diff-cover.md"
        cat target/llvm-cov/diff-cover.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the coverage report
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-report
        path: target/llvm-cov/

    # Data for the README badge, read by shields.io's endpoint badge
    # (https://shields.io/badges/endpoint-badge).
    - name: Write the badge data
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        jq '.data[0].totals.lines.percent as $p | {
          schemaVersion: 1,
          label: "coverage",
          message: "\($p * 10 | round / 10)%",
          color: (if $p >= 90 then "brightgreen" elif $p >= 75 then "green" elif $p >= 60 then "yellow" else "red" end)
        }' target/llvm-cov/summary.json > target/llvm-cov/html/coverage.json

    - name: Upload the Pages site
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: target/llvm-cov/html/

  # Publishes main's coverage report and badge data to GitHub Pages, at
  # https://rustlight.github.io/sacn/. Not part of all-checks, as it only runs
  # after a merge.
  coverage-pages:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v5.0.1

  # Runs for code and docs changes alike: Markdown files can be pulled into the
  # crate docs with include_str!, so their examples run as doctests.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false

    - name: Build documentation
      run: cargo doc --locked --no-deps
      env:
        RUSTDOCFLAGS: -D warnings

    - name: Run doctests
      run: cargo test --locked --doc

  # Checks that .github/workflows/actions.lock matches the workflows and that
  # every locked action commit still verifies upstream. After changing a
  # `uses:` line, run `gh actions-lock` to update the lockfile.
  lockfile:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false
    - uses: github/gh-actions-lock@verify/v0.5.1

  # Runs the lint hooks from .pre-commit-config.yaml (at the versions pinned
  # there, so CI matches local runs): rumdl and lychee for Markdown,
  # actionlint and zizmor for the workflows.
  lint:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.4.0
      with:
        persist-credentials: false

    - name: Run lint hooks
      uses: j178/prek-action@v3.1.1
      with:
        prek-version: '0.5.11'
        extra-args: --all-files rumdl-check lychee actionlint zizmor
      env:
        # Authenticated requests avoid GitHub's rate limits when installing
        # the tools and checking github.com links (GITHUB_TOKEN), and turn on
        # zizmor's online audits (GH_TOKEN).
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The single required status check. Jobs skipped by the path filter count as
  # passing; a failed or cancelled job (including `changes`) fails this one.
  all-checks:
    needs: [changes, test-linux, test-linux-ipv4, test-linux-ipv6, test-windows, test-macos, coverage, docs, lockfile, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Check job results
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for result in $RESULTS; do
          case "$result" in
            success|skipped) ;;
            *) echo "A required job did not succeed."; exit 1 ;;
          esac
        done
