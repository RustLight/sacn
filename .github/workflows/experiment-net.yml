# TEMPORARY experiment: can the network tests run on hosted Windows and macOS runners?
name: Experiment network tests
on:
  push:
    branches: [claude/project-thread-obr0ee]
permissions:
  contents: read
jobs:
  net:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, setup: lo0 }
          - { os: windows-latest, setup: none }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SETUP: ${{ matrix.setup }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      run: git clone --depth 1 -b "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY" .
    - name: Network info (before)
      run: |
        if [[ $RUNNER_OS == macOS ]]; then ifconfig; netstat -rn; else ipconfig //all; powershell -c "Get-NetAdapter | Format-Table -Auto; Get-NetIPInterface | Format-Table -Auto"; fi
    - name: Add test addresses (macOS)
      if: runner.os == 'macOS'
      run: |
        for a in 127.0.0.6 127.0.0.7 127.0.0.8 192.168.0.6; do sudo ifconfig lo0 alias "$a" netmask 255.255.255.255; done
        for a in 2a02:c7f:d20a:c600:a502:2dae:7716:601b 2a02:c7f:d20a:c600:a502:2dae:7716:601c 2a02:c7f:d20a:c600:a502:2dae:7716:601d; do sudo ifconfig lo0 inet6 "$a" prefixlen 128 alias; done
        # Multicast out of en0 fails with EHOSTUNREACH on hosted runners; send it out of lo0 by default.
        sudo route delete -net 224.0.0.0/4; sudo route add -net 224.0.0.0/4 -interface lo0; route -n get 239.255.0.1
        sudo route add -inet6 -net ff00:: -prefixlen 8 -interface lo0 || sudo route change -inet6 -net ff00:: -prefixlen 8 -interface lo0 || true
        # A second multicast-capable interface, like the veth pair on Linux: a fake ethernet pair.
        sudo ifconfig feth0 create && sudo ifconfig feth1 create && sudo ifconfig feth0 peer feth1 || true
        sudo ifconfig feth0 inet 192.168.100.6/24 up || true
        sudo ifconfig feth1 up || true
        ifconfig; netstat -rn
    - name: Add test addresses (Windows)
      if: runner.os == 'Windows' && matrix.setup != 'none'
      shell: pwsh
      run: |
        $if = (Get-NetRoute -DestinationPrefix 0.0.0.0/0 | Select-Object -First 1).ifIndex
        Write-Host "Using interface $if"
        foreach ($a in '192.168.0.6','192.168.0.7','192.168.0.8') { New-NetIPAddress -InterfaceIndex $if -IPAddress $a -PrefixLength 32 -SkipAsSource $true | Out-Null }
        foreach ($a in '2a02:c7f:d20a:c600:a502:2dae:7716:601b','2a02:c7f:d20a:c600:a502:2dae:7716:601c','2a02:c7f:d20a:c600:a502:2dae:7716:601d') { try { New-NetIPAddress -InterfaceIndex $if -IPAddress $a -PrefixLength 128 -SkipAsSource $true | Out-Null } catch { Write-Host $_ } }
        Start-Sleep 5
        Get-NetIPAddress -InterfaceIndex $if | Format-Table -Auto
        Get-NetFirewallProfile | Format-Table Name,Enabled -Auto
    - name: Multicast loopback probe
      run: |
        py=python3; command -v python3 >/dev/null || py=python
        "$py" .github/experiment/mcast_probe.py 192.168.0.6 127.0.0.1 127.0.0.6 192.168.100.6 || true
        # Apple-signed Python: local network privacy does not apply to Apple binaries.
        if [[ -x /usr/bin/python3 && $RUNNER_OS == macOS ]]; then
          en0ip=$(ipconfig getifaddr en0 || true)
          echo "Apple python3:"; /usr/bin/python3 .github/experiment/mcast_probe.py "$en0ip" 192.168.100.6 || true
        fi
    - name: Use loopback test addresses
      run: |
        sed -i.bak 's/\["192.168.0.6", "192.168.0.7", "192.168.0.8"\]/["127.0.0.6", "127.0.0.7", "127.0.0.8"]/' tests/ipv4_tests.rs
        sed -i.bak 's/"2a02:c7f:d20a:c600:a502:2dae:7716:601[bcd]"/"::1"/' tests/ipv6_tests.rs
        grep -n 'TEST_NETWORK_INTERFACE_IPV4: ' tests/ipv4_tests.rs; sed -n 12,16p tests/ipv6_tests.rs
    - name: Build tests
      run: cargo test --locked --no-run
    - name: Unit/integration tests (not ignored)
      run: cargo test --locked
    - name: IPv4 network tests, one at a time
      run: .github/experiment/run_serial.sh ipv4_tests
    - name: IPv6 test target, one at a time
      run: .github/experiment/run_serial.sh ipv6_tests
    - name: src_tests IPv6
      run: SACN_REQUIRE_IPV6=1 cargo test --locked --test src_tests ipv6 -- --nocapture || true
